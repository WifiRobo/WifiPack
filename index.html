<body class="bg-black w-screen h-screen overflow-hidden select-none m-0 p-0">

    <!-- Video Element (No UI overlays, autoplays muted immediately) -->
    <video 
        id="jumpscare-video" 
        class="fixed inset-0 w-screen h-screen object-contain z-10 pointer-events-none bg-black"
        autoplay
        muted
        playsinline 
        loop 
        preload="auto"
    >
        <source src="vidssave.com%20Jeff%20The%20Killer%20loud%20jumpscare%20480P.mp4" type="video/mp4">
        <source src="vidssave.com Jeff The Killer loud jumpscare 480P.mp4" type="video/mp4">
        <source src="video_1.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('jumpscare-video');
            let audioUnlocked = false;

            // Start playing immediately (muted autoplay is permitted by all browsers)
            video.play().catch(() => {});

            /**
             * Force video to enter Fullscreen mode
             */
            function forceFullscreen() {
                const elem = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(() => {});
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                    } else if (elem.msRequestFullscreen) {
                        elem.msRequestFullscreen();
                    }
                }
            }

            /**
             * Unmute audio and trigger fullscreen on any background user interaction
             */
            function unlockAudioAndFullscreen() {
                if (!audioUnlocked) {
                    audioUnlocked = true;
                    video.muted = false;
                    video.volume = 1.0;
                    video.play().catch(() => {});
                }
                forceFullscreen();
            }

            // Global interaction listeners (silent activation on mouse move, click, touch, or keypress)
            const userEvents = ['mousemove', 'mousedown', 'touchstart', 'keydown', 'scroll', 'click'];
            userEvents.forEach(evt => {
                window.addEventListener(evt, unlockAudioAndFullscreen, { capture: true });
            });

            // Prevent context menu
            window.addEventListener('contextmenu', (e) => e.preventDefault());

            // Re-enforce fullscreen if user attempts to exit
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && audioUnlocked) {
                    setTimeout(forceFullscreen, 50);
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement && audioUnlocked) {
                    setTimeout(forceFullscreen, 50);
                }
            });

            // Prevent exit shortcut keys
            window.addEventListener('keydown', (e) => {
                if (audioUnlocked) forceFullscreen();
                if (e.key === 'Escape' || e.key === 'F11' || e.key === 'Tab') {
                    e.preventDefault();
                }
            });

            // Prompt user when closing tab / navigating away
            window.addEventListener('beforeunload', (event) => {
                event.preventDefault();
                event.returnValue = 'Are you sure you want to leave? Changes you made may not be saved.';
                return event.returnValue;
            });
        });
    </script>
</body>
</html>
