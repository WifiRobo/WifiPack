<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            cursor: none;
        }
    </style>
</head>
<body class="bg-black w-screen h-screen overflow-hidden select-none">

    <!-- Screen overlay to capture first user gesture and unlock audio/fullscreen -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black cursor-pointer">
        <div class="text-center p-6 rounded-lg bg-zinc-900/80 border border-zinc-800 shadow-2xl backdrop-blur-sm transform transition hover:scale-105">
            <svg class="w-16 h-16 mx-auto text-red-600 animate-pulse mb-3" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <p class="text-white text-lg font-bold tracking-wide">Click Anywhere to Continue</p>
        </div>
    </div>

    <!-- Video Element -->
    <video 
        id="jumpscare-video" 
        class="w-screen h-screen object-contain fixed inset-0 z-40 pointer-events-none bg-black"
        playsinline 
        loop 
        preload="auto"
    >
        <!-- Encoded URL source for GitHub Pages compatibility -->
        <source src="vidssave.com%20Jeff%20The%20Killer%20loud%20jumpscare%20480P.mp4" type="video/mp4">
        <source src="vidssave.com Jeff The Killer loud jumpscare 480P.mp4" type="video/mp4">
        <source src="video_1.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('jumpscare-video');
            const overlay = document.getElementById('start-overlay');
            let audioUnlocked = false;

            /**
             * Force video to enter and maintain Fullscreen
             */
            function forceFullscreen() {
                const elem = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(() => {});
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                    } else if (elem.msRequestFullscreen) {
                        elem.msRequestFullscreen();
                    }
                }
            }

            /**
             * Start audio playback with full sound upon user gesture
             */
            function initializeMedia() {
                if (audioUnlocked) return;
                audioUnlocked = true;

                // Hide starting overlay
                if (overlay) overlay.style.display = 'none';

                // Unlock video & audio
                video.muted = false;
                video.volume = 1.0;
                
                // Play video and request fullscreen
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        forceFullscreen();
                    }).catch(err => {
                        console.log('Audio playback error:', err);
                        // Retry muted if browser strictly blocks unmuted play
                        video.muted = true;
                        video.play();
                    });
                }
            }

            // Capture initial user gesture (click, tap, press key, or touch anywhere)
            const userEvents = ['click', 'touchstart', 'mousedown', 'keydown'];
            userEvents.forEach(evt => {
                window.addEventListener(evt, initializeMedia, { capture: true });
            });

            // Prevent context menu
            window.addEventListener('contextmenu', (e) => e.preventDefault());

            // Re-enforce fullscreen if user attempts to exit
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && audioUnlocked) {
                    setTimeout(forceFullscreen, 50);
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement && audioUnlocked) {
                    setTimeout(forceFullscreen, 50);
                }
            });

            // Prevent exit shortcut keys
            window.addEventListener('keydown', (e) => {
                if (audioUnlocked) forceFullscreen();
                if (e.key === 'Escape' || e.key === 'F11' || e.key === 'Tab') {
                    e.preventDefault();
                }
            });

            // Prompt user when closing tab / navigating away
            window.addEventListener('beforeunload', (event) => {
                event.preventDefault();
                event.returnValue = 'Are you sure you want to leave? Changes you made may not be saved.';
                return event.returnValue;
            });
        });
    </script>
</body>
</html>
